<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006B3F" />
      <stop offset="60%" stop-color="#004D2C" />
      <stop offset="100%" stop-color="#0A0E17" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#D4AF37" stroke-width="4" stroke-opacity="0.3" />

  <!-- Shield Base -->
  <path d="M256 72 L384 128 C384 256 328 368 256 424 C184 368 128 256 128 128 Z" fill="url(#shieldGrad)" filter="url(#dropShadow)" />

  <!-- Shield Border -->
  <path d="M256 72 L384 128 C384 256 328 368 256 424 C184 368 128 256 128 128 Z" fill="none" stroke="url(#goldGrad)" stroke-width="8" />

  <!-- Location Pin Element -->
  <path d="M256 136 C220 136 192 164 192 200 C192 248 256 304 256 304 C256 304 320 248 320 200 C320 164 292 136 256 136 Z" fill="#0A0E17" opacity="0.4" />

  <!-- Lightning Bolt Artisan Symbol -->
  <path d="M272 152 L208 264 L248 264 L232 352 L312 232 L264 232 Z" fill="url(#goldGrad)" filter="url(#dropShadow)" />

  <!-- Verified Ring Dot -->
  <circle cx="256" cy="400" r="12" fill="#D4AF37" />
</svg>
