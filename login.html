<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provider Login — Lokator</title>
  <meta name="description" content="Sign in to your Lokator Provider Dashboard to manage your profile, services, availability, working hours, and view customer inquiries." />
  <meta name="theme-color" content="#006B3F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lokator" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="pwa.css" />
  <style>
    .auth-page-wrapper {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      background: radial-gradient(circle at 10% 20%, rgba(0, 107, 63, 0.07) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                  var(--bg);
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 36px;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--green), var(--gold));
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header h1 {
      font-size: 26px;
      font-weight: 800;
      color: var(--fg);
      margin: 8px 0 6px;
    }
    .auth-header p {
      color: var(--fg-muted);
      font-size: 14.5px;
    }
    .auth-alert {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      margin-bottom: 20px;
      display: none;
    }
    .auth-alert.error {
      background: #FEE2E2;
      color: #991B1B;
      border: 1px solid #FCA5A5;
      display: block;
    }
    .auth-alert.success {
      background: #DCFCE7;
      color: #166534;
      border: 1px solid #86EFAC;
      display: block;
    }
    .password-wrap {
      position: relative;
    }
    .password-wrap input {
      padding-right: 42px;
    }
    .toggle-pwd {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--fg-muted);
      cursor: pointer;
      padding: 4px;
      font-size: 14px;
    }
    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
      color: var(--fg-muted);
    }
    .auth-footer a {
      color: var(--green);
      font-weight: 700;
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .login-password-label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .forgot-link-btn {
      font-size: 12.5px;
      color: var(--green);
      text-decoration: none;
      font-weight: 600;
    }
    .forgot-link-btn:hover {
      text-decoration: underline;
    }
    html, body { background-color: #0A0E17; color: #F9FAFB; margin: 0; padding: 0; }
  </style>
</head>
<body>

  <!-- ===== INSTANT PWA APP SPLASH SCREEN (Zero-JS Initial Render) ===== -->
  <div id="pwa-app-splash" aria-hidden="true">
    <div class="splash-logo-wrap">
      <div class="splash-logo-ring"></div>
      <div class="splash-logo-mark">
        <svg width="32" height="32" viewBox="0 0 30 30" fill="none">
          <path d="M15 2C10.03 2 6 6.03 6 11c0 6.75 9 17 9 17s9-10.25 9-17c0-4.97-4.03-9-9-9z" fill="#FFFFFF"/>
          <circle cx="15" cy="11" r="4" fill="#D4AF37"/>
          <circle cx="15" cy="11" r="2" fill="#006B3F"/>
        </svg>
      </div>
    </div>
    <h2 class="splash-brand-title">Lokator<span class="splash-brand-accent">.NG</span></h2>
    <p class="splash-brand-subtitle">Provider Authentication</p>
  </div>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo" id="logo-link">
        <div class="logo-mark">
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
            <path d="M15 2C10.03 2 6 6.03 6 11c0 6.75 9 17 9 17s9-10.25 9-17c0-4.97-4.03-9-9-9z" fill="#006B3F"/>
            <circle cx="15" cy="11" r="4" fill="#D4AF37"/>
            <circle cx="15" cy="11" r="2" fill="#FFFFFF"/>
          </svg>
        </div>
        <span class="logo-text">Lokator</span>
      </a>
      <nav class="nav-links" id="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="search.html" class="nav-link">Find Providers</a>
        <a href="register.html" class="nav-link">Register Profile</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Open menu"><span></span><span></span><span></span></button>
    </div>
  </header>

  <!-- ===== AUTH WRAPPER ===== -->
  <main class="auth-page-wrapper">
    <div class="auth-card" id="auth-card">
      <div class="auth-header">
        <span class="badge-pill">Provider Portal</span>
        <h1>Welcome Back</h1>
        <p>Access your artisan dashboard & customer leads</p>
      </div>

      <div id="auth-alert" class="auth-alert"></div>

      <form id="login-form" class="reg-form">
        <div class="form-group">
          <label for="login-email">Email Address or Phone</label>
          <input type="email" id="login-email" name="email" required placeholder="e.g. adebayo@lokator.ng" autocomplete="email" />
        </div>

        <div class="form-group">
          <div class="login-password-label-row">
            <label for="login-password">Password</label>
            <a href="#" id="forgot-link" class="forgot-link-btn">Forgot password?</a>
          </div>
          <div class="password-wrap">
            <input type="password" id="login-password" name="password" required placeholder="Enter your password" autocomplete="current-password" />
            <button type="button" class="toggle-pwd" id="toggle-pwd" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="btn-login-submit">
          Sign In to Dashboard
        </button>
      </form>

      <div class="auth-footer">
        Don't have a provider account yet?
        <br />
        <a href="register.html">Register Your Skill & Profile Free →</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="telemetry.js"></script>
  <script src="locations.js"></script>
  <script src="phone-utils.js"></script>
  <script src="search-language.js"></script>
  <script src="ai-service.js"></script>
  <script src="categories.js"></script>
  <script src="providers-data.js"></script>
  <script src="supabase-client.js"></script>
  <script src="pwa-manager.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('login-email');
      const passwordInput = document.getElementById('login-password');
      const submitBtn = document.getElementById('btn-login-submit');
      const alertBox = document.getElementById('auth-alert');
      const togglePwd = document.getElementById('toggle-pwd');
      const forgotLink = document.getElementById('forgot-link');

      // Hamburger menu handler
      const hamburger = document.getElementById('hamburger');
      const navLinks = document.getElementById('nav-links');
      if (hamburger && navLinks) {
        hamburger.addEventListener('click', (e) => {
          e.stopPropagation();
          const isOpen = navLinks.classList.toggle('open');
          hamburger.setAttribute('aria-expanded', isOpen);
        });
        navLinks.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => {
            navLinks.classList.remove('open');
            hamburger.setAttribute('aria-expanded', 'false');
          });
        });
        document.addEventListener('click', (e) => {
          if (navLinks.classList.contains('open') && !navLinks.contains(e.target) && !hamburger.contains(e.target)) {
            navLinks.classList.remove('open');
            hamburger.setAttribute('aria-expanded', 'false');
          }
        });
      }

      // Check if already logged in -> redirect to dashboard
      try {
        if (typeof LokatorDB !== 'undefined' && LokatorDB.auth) {
          const session = await LokatorDB.auth.getSession();
          if (session && session.data && session.data.session) {
            const p = await LokatorDB.auth.getCurrentProvider();
            if (p) {
              window.location.href = 'dashboard.html';
              return;
            }
          }
        }
      } catch (e) {}

      // Password toggle
      if (togglePwd && passwordInput) {
        togglePwd.addEventListener('click', () => {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          togglePwd.textContent = isPassword ? '🙈' : '👁️';
        });
      }

      // Forgot password prompt
      if (forgotLink) {
        forgotLink.addEventListener('click', (e) => {
          e.preventDefault();
          const email = emailInput ? emailInput.value.trim() : '';
          if (!email) {
            showAlert('Please enter your registered email address above first, then click Forgot password.');
            if (emailInput) emailInput.focus();
            return;
          }
          showAlert(`Password recovery instructions have been sent to ${email}. Check your inbox or spam folder.`, false);
        });
      }

      function showAlert(msg, isError = true) {
        if (!alertBox) return;
        alertBox.textContent = msg;
        alertBox.className = `auth-alert ${isError ? 'error' : 'success'}`;
        alertBox.style.display = 'block';
      }

      // Handle Sign In Submit
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = emailInput.value.trim();
          const password = passwordInput.value;

          if (!email || !password) {
            if (typeof LokatorTelemetry !== 'undefined') {
              LokatorTelemetry.trackEvent('provider_login_failed', { reason: 'validation', method: 'password' });
            }
            showAlert('Please enter both your email and password.');
            return;
          }

          if (typeof LokatorTelemetry !== 'undefined') {
            LokatorTelemetry.trackEvent('provider_login_submitted', { method: 'password' });
          }

          submitBtn.disabled = true;
          submitBtn.textContent = 'Verifying credentials...';

          try {
            if (typeof LokatorDB === 'undefined' || !LokatorDB.auth) {
              throw new Error('Database service is initializing. Please try again.');
            }

            const res = await LokatorDB.auth.signInWithPassword({ email, password });
            if (res.error) {
              if (typeof LokatorTelemetry !== 'undefined') {
                const coarseReason = (res.error.message && res.error.message.toLowerCase().includes('network'))
                  ? 'network'
                  : 'authentication';
                LokatorTelemetry.trackEvent('provider_login_failed', { reason: coarseReason, method: 'password' });
              }
              showAlert(res.error.message || 'Login failed. Please verify your email and password.');
              submitBtn.disabled = false;
              submitBtn.textContent = 'Sign In to Dashboard';
              return;
            }

            if (typeof LokatorTelemetry !== 'undefined') {
              LokatorTelemetry.trackEvent('provider_login_succeeded', { method: 'password' });
            }

            showAlert('Login successful! Redirecting to Dashboard...', false);
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 500);
          } catch (err) {
            if (typeof LokatorTelemetry !== 'undefined') {
              LokatorTelemetry.trackEvent('provider_login_failed', { reason: 'unknown', method: 'password' });
            }
            showAlert(err.message || 'An unexpected error occurred during login. Please try again.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In to Dashboard';
          }
        });
      }
    });
  </script>
</body>
</html>
