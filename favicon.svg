<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded dark background for tab visibility -->
  <rect width="100" height="100" rx="22" fill="#1A2332" />

  <g transform="translate(5, 5) scale(0.9)">
