<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — PadiFix</title>
  <meta name="description" content="You are currently offline. Previously loaded content may still be available." />
  <meta name="theme-color" content="#00A859" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PadiFix" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=11.00" />
  <style>
    html, body {
      background-color: #0A0E17;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--fg);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .offline-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      text-align: center;
    }
    .offline-card {
      max-width: 440px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }
    .offline-icon-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
    }
    .offline-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--fg);
      margin-bottom: 10px;
    }
    .offline-desc {
      font-size: 14.5px;
      color: var(--fg-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .offline-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-retry {
      background: var(--green);
      color: #fff;
      font-weight: 700;
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-retry:hover {
      background: var(--green-hover);
      transform: translateY(-1px);
    }
    .btn-secondary-link {
      background: rgba(255, 255, 255, 0.05);
      color: var(--fg);
      font-weight: 600;
      padding: 13px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-decoration: none;
      font-size: 14px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-secondary-link:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-hover);
    }
    .offline-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--gold);
      background: rgba(245, 158, 11, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .offline-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-card">
      <div class="offline-status-pill">
        <span class="offline-dot"></span> No Internet Connection
      </div>
      <div class="offline-icon-wrap">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1 class="offline-title">You’re Offline</h1>
      <p class="offline-desc">Previously loaded PadiFix content may still be available in your local cache. Reconnect to the internet to continue discovering live providers across Nigeria.</p>
      
      <div class="offline-actions">
        <button class="btn-retry" onclick="window.location.reload();">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          Try Reconnecting
        </button>
        <a href="search.html" class="btn-secondary-link">Explore Cached Directory</a>
        <a href="dashboard.html" class="btn-secondary-link">Provider Dashboard (Offline)</a>
      </div>
    </div>
  </div>

  <script>
    // Automatically attempt reload when connectivity returns
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
